# 六儿 游戏服务器 Nginx 反代配置（生产环境）
# wss://liuer.xin/ws            ->  127.0.0.1:3000
# https://liuer.xin/admin       ->  127.0.0.1:8080（后台管理系统）
# https://liuer.xin/api/admin/  ->  127.0.0.1:8080/api/admin/（后台 API，兼容前端绝对路径）

# HTTP：仅 ACME 验证 + 301 跳 HTTPS
server {
    listen 80;
    server_name liuer.xin;

    # 证书续期挑战路径（certbot 自动管理，必须保留在 301 之前）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余 HTTP 全部跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS + WebSocket（WSS）反代
server {
    listen 443 ssl;
    server_name liuer.xin;

    ssl_certificate     /etc/letsencrypt/live/liuer.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liuer.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS：强制浏览器后续使用 HTTPS（max-age 1 年，包含子域）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 后台 API（优先匹配，避免落入 / 到游戏服）
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8080/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 后台管理系统（独立 8080 端口）
    # 访问地址：https://liuer.xin/admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # 后台静态资源禁用长期缓存，避免升级后浏览器仍用旧版
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 六儿小游戏 WebSocket 路径：wss://liuer.xin/ws
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 普通 HTTP 接口（健康检查 /api/auth/wx-login 等）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
